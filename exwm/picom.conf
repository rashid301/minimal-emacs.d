# picom for the EXWM-in-Xephyr session (started by start.sh).
#
# Goal: depth and rounded corners for EXWM's *floating* windows (dialogs, pickers, Picture-in-Picture)
# only.  Tiled windows (Firefox, terminals, the Emacs frame) are left exactly as they are: no shadow,
# square corners.  EXWM names every floating window's container
# "EXWM floating frame container for 0x...", so that is what the conditions below match.
#
# xrender backend: Xephyr has no usable vsync/GL path, and xrender is the safe choice for a nested server.

backend = "xrender";
vsync = false;
use-damage = false;
log-level = "warn";

# --- shadows (floating windows only) ---
shadow = true;
shadow-radius = 20;
shadow-offset-x = -14;
shadow-offset-y = -10;
shadow-opacity = 0.40;
shadow-exclude = [
  "! name *= 'EXWM floating'"
];

# --- rounded corners (floating windows only) ---
corner-radius = 12;
rounded-corners-exclude = [
  "! name *= 'EXWM floating'"
];

# --- no fading / transparency: keep things snappy and text crisp ---
fading = false;
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
